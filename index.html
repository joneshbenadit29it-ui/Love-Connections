<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="cjIfI1ENssozyDQscJTHEonCtXkAAuGcYpeSAuCsvFo" />

  <!-- SEO & Open Graph Metadata -->
  <title>Love Connections — Live ECE/EEE Circuit Simulator</title>
  <meta name="description" content="Love Connections is an interactive ECE and EEE web circuit simulator built by Jonesh Benadit J. Wire SVG components and analyze waveforms live.">
  <meta name="keywords" content="Jonesh Benadit J, Jonesh Benadit, Love Connections, Circuit Simulator, ECE, EEE, Web Circuit Simulator">
  <meta name="author" content="Jonesh Benadit J">
  <meta property="og:title" content="Love Connections — Circuit Simulator by Jonesh Benadit J">
  <meta property="og:description" content="Interactive ECE/EEE web circuit simulator created by Jonesh Benadit J.">
  <meta property="og:url" content="https://joneshbenadit29it-ui.github.io/Love-Connections/">
  <meta property="og:type" content="website">

  <!-- Stylesheet Path -->
  <link rel="stylesheet" href="public/css/styles.css">
  
  <!-- Font Awesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- TOP NAVIGATION BAR -->
  <header id="top-bar">
    <div class="brand">
      <i class="fa-solid fa-microchip logo-icon"></i>
      <h1>Love Connections</h1>
      <span class="badge">v1.0 ECE/EEE</span>
    </div>

    <div class="toolbar-actions">
      <button class="tool-btn" onclick="clearWorkspace()" title="Clear Canvas">
        <i class="fa-solid fa-trash-can"></i> Clear
      </button>
      <button class="tool-btn" onclick="exportCircuit()" title="Export JSON">
        <i class="fa-solid fa-download"></i> Export
      </button>
      <button class="tool-btn" onclick="importCircuit()" title="Import JSON">
        <i class="fa-solid fa-file-import"></i> Import
      </button>
      <button class="tool-btn btn-primary" onclick="runSimulation()">
        <i class="fa-solid fa-play"></i> RUN SIMULATION
      </button>
    </div>
  </header>

  <!-- MAIN APP WORKSPACE CONTAINERS -->
  <div id="app-container">

    <!-- LEFT SIDEBAR: COMPONENT CATALOG -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <h3>Component Library</h3>
        <p>Click or drag components to place them on the grid workspace.</p>
      </div>

      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="component-search" placeholder="Search sources, passive, active..." onkeyup="filterComponents()">
      </div>

      <div id="catalog" class="catalog-scroll">

        <!-- Power Sources Section -->
        <div class="catalog-category">
          <h4>Power Sources</h4>

          <button class="comp-btn" onclick="spawnComponent('DC_VOLTAGE', '9V Battery', '#e67e22', 40, 50, [{x_rel:0, y_rel:-25},{x_rel:0, y_rel:25}])">
            <i class="fa-solid fa-car-battery"></i>
            <div class="comp-info">
              <span class="comp-title">DC Voltage Source</span>
              <span class="comp-desc">9V Primary Supply</span>
            </div>
          </button>

          <button class="comp-btn" onclick="spawnComponent('AC_VOLTAGE', 'AC Generator', '#3498db', 40, 50, [{x_rel:0, y_rel:-25},{x_rel:0, y_rel:25}])">
            <i class="fa-solid fa-wave-square"></i>
            <div class="comp-info">
              <span class="comp-title">AC Source</span>
              <span class="comp-desc">5V Peak 60Hz</span>
            </div>
          </button>

          <button class="comp-btn" onclick="spawnComponent('GND', 'Ground Node', '#2c3e50', 30, 30, [{x_rel:0, y_rel:-15}])">
            <i class="fa-solid fa-location-pin"></i>
            <div class="comp-info">
              <span class="comp-title">Ground Reference</span>
              <span class="comp-desc">0V Reference Node</span>
            </div>
          </button>
        </div>

        <!-- Passive Components Section -->
        <div class="catalog-category">
          <h4>Passive Components</h4>

          <button class="comp-btn" onclick="spawnComponent('RES_GENERIC', 'Resistor 1k', '#d2b48c', 70, 20, [{x_rel:-35, y_rel:0},{x_rel:35, y_rel:0}])">
            <i class="fa-solid fa-ruler-horizontal"></i>
            <div class="comp-info">
              <span class="comp-title">Resistor (1kΩ)</span>
              <span class="comp-desc">Current Limiter</span>
            </div>
          </button>

          <button class="comp-btn" onclick="spawnComponent('CAPACITOR', 'Capacitor 10uF', '#9b59b6', 60, 20, [{x_rel:-30, y_rel:0},{x_rel:30, y_rel:0}])">
            <i class="fa-solid fa-bars-staggered"></i>
            <div class="comp-info">
              <span class="comp-title">Capacitor (10µF)</span>
              <span class="comp-desc">Energy Storage</span>
            </div>
          </button>

          <button class="comp-btn" onclick="spawnComponent('INDUCTOR', 'Inductor 1mH', '#16a085', 70, 20, [{x_rel:-35, y_rel:0},{x_rel:35, y_rel:0}])">
            <i class="fa-solid fa-scroll"></i>
            <div class="comp-info">
              <span class="comp-title">Inductor (1mH)</span>
              <span class="comp-desc">Magnetic Core</span>
            </div>
          </button>
        </div>

        <!-- Active Components & Output Section -->
        <div class="catalog-category">
          <h4>Active & Semiconductors</h4>

          <button class="comp-btn" onclick="spawnComponent('LED_RED', 'Red LED', '#e74c3c', 50, 30, [{x_rel:-25, y_rel:0},{x_rel:25, y_rel:0}])">
            <i class="fa-regular fa-lightbulb"></i>
            <div class="comp-info">
              <span class="comp-title">Red LED</span>
              <span class="comp-desc">2.0V Forward Bias</span>
            </div>
          </button>

          <button class="comp-btn" onclick="spawnComponent('DIODE_1N4148', 'Diode 1N4148', '#f39c12', 60, 25, [{x_rel:-30, y_rel:0},{x_rel:30, y_rel:0}])">
            <i class="fa-solid fa-play"></i>
            <div class="comp-info">
              <span class="comp-title">Diode (1N4148)</span>
              <span class="comp-desc">Switching Diode</span>
            </div>
          </button>

          <button class="comp-btn" onclick="spawnComponent('OPAMP_LM741', 'LM741 Op-Amp', '#2c3e50', 80, 60, [{x_rel:-40, y_rel:-15},{x_rel:-40, y_rel:15},{x_rel:40, y_rel:0}])">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <div class="comp-info">
              <span class="comp-title">LM741 Op-Amp</span>
              <span class="comp-desc">Operational Amplifier</span>
            </div>
          </button>

          <button class="comp-btn" onclick="spawnComponent('NPN_BJT', '2N2222 NPN', '#27ae60', 60, 60, [{x_rel:-20, y_rel:-20},{x_rel:-20, y_rel:20},{x_rel:20, y_rel:0}])">
            <i class="fa-solid fa-diagram-project"></i>
            <div class="comp-info">
              <span class="comp-title">NPN Transistor</span>
              <span class="comp-desc">2N2222 BJT</span>
            </div>
          </button>
        </div>

      </div>

      <!-- Footer Quick Status -->
      <div class="sidebar-footer">
        <p>Engine Status: <span id="engine-status" class="status-ready">Ready</span></p>
      </div>
    </aside>

    <!-- RIGHT WORKSPACE CANVAS & SIMULATION LOGS -->
    <main id="workspace">
      
      <!-- Interactive SVG/Canvas Render Area -->
      <div id="canvas-wrapper">
        <canvas id="circuitCanvas"></canvas>
        
        <!-- On-Canvas Controls -->
        <div id="canvas-overlay-controls">
          <button onclick="zoomIn()"><i class="fa-solid fa-plus"></i></button>
          <button onclick="zoomOut()"><i class="fa-solid fa-minus"></i></button>
          <button onclick="resetZoom()"><i class="fa-solid fa-expand"></i></button>
        </div>
      </div>

      <!-- Bottom SPICE Simulation Log Console -->
      <section id="console">
        <div class="console-header">
          <span><i class="fa-solid fa-terminal"></i> SPICE Output & Node Voltages</span>
          <button class="btn-clear-log" onclick="clearLogs()">Clear Output</button>
        </div>
        <div id="log" class="console-body">
          <div class="log-entry system">> Engine ready. Select components to begin...</div>
        </div>
      </section>

    </main>
  </div>

  <!-- COMPONENT PROPERTIES MODAL -->
  <div id="properties-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h3>Edit Component Parameters</h3>
      <form id="properties-form">
        <div class="form-group">
          <label for="prop-name">Label / Identifier:</label>
          <input type="text" id="prop-name">
        </div>
        <div class="form-group">
          <label for="prop-value">Value (Voltage / Resistance / Capacitance):</label>
          <input type="text" id="prop-value">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="button" class="btn-primary" onclick="saveProperties()">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPT INCLUSIONS -->
  <script src="public/js/spiceEngine.js"></script>
  <script src="public/js/app.js"></script>

</body>
</html>
